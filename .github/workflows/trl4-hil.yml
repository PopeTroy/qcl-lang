name: TRL4 Hardware-in-Loop Simulation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  hil-testbench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Purge Toolchain Locks
        run: find . -name "rust-toolchain*" -type f -delete

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          override: true
          components: clippy, rustfmt

      - name: Install System Dependencies (Z3 & LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 libz3-dev llvm-18-dev libclang-18-dev clang

      - name: Check Workspace Topology
        run: cargo check --workspace

      - name: Build Workspace Release
        run: cargo build --workspace --release

      - name: Run Workspace Tests
        run: cargo test --workspace
