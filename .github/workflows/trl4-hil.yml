name: TRL4 Hardware-in-Loop Simulation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  hil-testbench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (LLVM 17, Clang 17, Z3)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev clang-17 z3 libz3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          components: clippy, rustfmt

      - name: Check Workspace Topology
        run: cargo check --workspace

      - name: Build Workspace Release
        run: cargo build --workspace --release

      - name: Run Workspace Tests
        run: cargo test --workspace
