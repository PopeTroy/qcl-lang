name: TRL4 Hardware-in-Loop Simulation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  hil-testbench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (LLVM 18, Clang 18, Z3)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 z3 libz3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.79.0'
          components: clippy, rustfmt

      - name: Check Workspace Topology
        run: cargo check --workspace

      - name: Build Hardware Simulators & Release Binary
        run: cargo build --workspace --release

      - name: Run Hardware Loop Benchmarks
        run: cargo test --workspace
