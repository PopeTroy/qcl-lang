[workspace]
resolver = "2"
members = [
    "compiler",
    "runtime",
    "verification",
]
exclude = ["benchmarks", "scripts"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Celsius Tech Media Group <info@celsiustechmediagroup.co.za>"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
# Core Infra
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
parking_lot = "0.12"
crossbeam = "0.8"

# Math & Physics
nalgebra = "0.33"
num-traits = "0.2"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.16"

# Solver & Formal Verification
z3 = { version = "0.15", features = ["serde"] }
egg = "0.12"

# Compiler Infra
pest = "2.7"
pest_derive = "2.7"
inkwell = { version = "0.4.0", features = ["llvm18-0"] }

# Runtime & WASM
wasmtime = { version = "20.0", features = ["component-model-async", "cranelift"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
