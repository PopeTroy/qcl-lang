[workspace]
resolver = "2"
members = [
    "compiler",
    "runtime",
]
exclude = ["benchmarks", "scripts", "verification"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Celsius Tech Media Group <info@celsiustechmediagroup.co.za>"]
license = "MIT OR Apache-2.0"
rust-version = "1.79"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
parking_lot = "0.12"
crossbeam = "0.8"
nalgebra = "0.33"
num-traits = "0.2"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.16"
z3 = "0.15"
egg = { version = "0.10", features = ["serde-1"], default-features = false }
pest = { version = "2.7", features = ["serde"] }
pest_derive = "2.7"

# GRAPH / HASHING
petgraph = { version = "0.6", features = ["serde-1", "graphmap", "stable_graph"] }
rustc-hash = "1.1"
indexmap = { version = "2.0", features = ["serde-1"] }

# CLI / DIAGNOSTICS
clap = { version = "4.5", features = ["derive", "env", "std", "unicode"] }
ariadne = { version = "0.4", features = ["std"] }
codespan-reporting = "0.11"

# UNIFIED WASM / CRANELIFT CODEGEN BACKEND
wasmtime = { version = "20.0", features = ["component-model", "async", "cranelift"], default-features = false }
cranelift-codegen = { version = "0.107", features = ["target-x86_64", "target-aarch64", "target-wasm32"] }
cranelift-wasm = { version = "0.107", features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "debuginfo"
opt-level = 3
